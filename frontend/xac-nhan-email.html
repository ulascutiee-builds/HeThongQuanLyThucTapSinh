<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />

  <title>Xác nhận đổi email | Career Portal</title>
  <link rel="icon" type="image/png" href="ictu-codegym-logo.png?v=20261012-new" />
  <link rel="stylesheet" href="system-font.css?v=20261009" />
  <style>
    :root{font-family:"Segoe UI",Arial,sans-serif;color:#172b4d;background:#f2f7fd}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 10% 5%,#dbeaff 0,transparent 42%),radial-gradient(circle at 90% 95%,#e6f1ff 0,transparent 38%),#f2f7fd}main{width:min(100%,470px);background:#fff;border:1px solid #dce7f3;border-radius:22px;padding:38px;box-shadow:0 20px 55px #194c8a16}.brand{display:flex;align-items:center;gap:14px;font-size:14px;font-weight:800;letter-spacing:.04em;color:#173b78}.brand img{width:62px;height:62px;object-fit:contain}.brand small{display:block;margin-top:4px;font-size:11px;color:#65768e;letter-spacing:0}h1{font-size:29px;line-height:1.2;margin:34px 0 12px}p{font-size:15px;line-height:1.65;color:#52627a;margin:0 0 22px}.message{padding:14px 16px;border-radius:10px;background:#fff1ef;color:#8c281f;font-size:14px;line-height:1.55;margin:20px 0}.message.success{background:#e8f7ef;color:#185337}.action{display:block;width:100%;padding:14px 20px;border:0;border-radius:10px;background:#173b78;color:#fff;font:inherit;font-size:15px;font-weight:700;cursor:pointer}.action:hover{background:#112f63}.action:disabled{opacity:.65;cursor:wait}.footer{margin:24px 0 0;font-size:13px;text-align:center}.footer a{color:#173b78;font-weight:700;text-decoration:none}[hidden]{display:none!important}@media(max-width:500px){main{padding:27px 22px}h1{font-size:25px}}
    #message{position:fixed;top:20px;right:20px;z-index:1200;width:min(460px,calc(100vw - 40px));margin:0;box-shadow:0 12px 32px #19365e1c}@media(max-width:600px){#message{top:12px;right:12px;left:12px;width:auto}}
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="ictu-codegym-logo.png?v=20261012-new" alt="ICTU × CODEGYM" /><div>CAREER PORTAL<small>HỆ THỐNG QUẢN LÝ THỰC TẬP SINH</small></div></div>
    <h1 id="title">Xác nhận đổi email</h1>
    <p id="description">Nhấn nút bên dưới để dùng địa chỉ nhận thư này làm email đăng nhập mới. Liên kết chỉ có hiệu lực 24 giờ và dùng một lần.</p>
    <div id="message" class="message" role="alert" aria-live="polite" hidden></div>
    <form id="confirm-form"><button class="action" id="confirm-button" type="submit">Xác nhận đổi email</button></form>
    <p class="footer"><a href="dang-nhap.html">Quay lại trang đăng nhập</a></p>
  </main>
  <script src="email-change.js?v=20261012" defer></script>
