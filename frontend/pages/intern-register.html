<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f7f3" />
    <title>Đăng ký thực tập sinh | Career Portal</title>

    <style>
      :root {
        color-scheme: light;
        --paper: #f8f7f3;
        --surface: #fffefa;
        --ink: #20332e;
        --muted: #7d8983;
        --green: #194c40;
        --orange: #e36b48;
        --line: #dce1dc;
        --error: #b34d35;
        --success: #2f765d;
        --serif: Georgia, "Times New Roman", serif;
        --sans: "Segoe UI", "Helvetica Neue", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }

      .page {
        display: flex;
        min-height: 100vh;
        min-height: 100svh;
        flex-direction: column;
        padding: 0 clamp(22px, 6vw, 64px);
      }

      main {
        width: min(100%, 520px);
        margin: auto;
        padding: 42px 0 34px;
        animation: arrive 450ms ease both;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: var(--orange);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: var(--serif);
        font-size: 32px;
        font-weight: 400;
        line-height: 1.2;
      }

      .intro {
        margin: 9px 0 24px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.6;
      }

      form {
        padding-top: 20px;
        border-top: 1px solid var(--line);
      }

      .fields {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px 14px;
      }

      .field {
        display: grid;
        gap: 7px;
      }

      .field-wide {
        grid-column: 1 / -1;
      }

      label {
        font-size: 10px;
        font-weight: 650;
      }

      input {
        width: 100%;
        height: 41px;
        padding: 0 11px;
        border: 1px solid var(--line);
        border-radius: 2px;
        outline: none;
        background: var(--surface);
        color: var(--ink);
        font: inherit;
        font-size: 11px;
      }

      input::placeholder {
        color: #a2aaa5;
      }

      input:focus {
        border-color: var(--green);
        box-shadow: 0 0 0 3px #194c4014;
      }

      input:invalid:not(:placeholder-shown) {
        border-color: var(--error);
      }

      .helper {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 9px;
        line-height: 1.5;
      }

      .submit-button {
        display: flex;
        width: 100%;
        height: 42px;
        align-items: center;
        justify-content: space-between;
        margin-top: 18px;
        padding: 0 14px;
        border: 0;
        border-radius: 2px;
        background: var(--green);
        color: white;
        cursor: pointer;
        font: inherit;
        font-size: 11px;
        font-weight: 700;
      }

      .submit-button:hover {
        background: #123d33;
      }

      .submit-button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      .submit-arrow {
        font-size: 16px;
        font-weight: 400;
      }

      .form-message {
        min-height: 17px;
        margin: 10px 0 0;
        color: var(--error);
        font-size: 10px;
        line-height: 1.5;
      }

      .form-message[data-state="success"] {
        color: var(--success);
      }

      .login-link {
        display: inline-block;
        margin-top: 15px;
        color: var(--green);
        font-size: 11px;
        text-decoration: none;
      }

      .login-link:hover {
        color: var(--orange);
      }

      footer {
        display: flex;
        min-height: 42px;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        color: var(--muted);
        font-size: 8px;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }

      footer a {
        color: inherit;
        text-decoration: none;
      }

      :focus-visible {
        outline: 2px solid var(--orange);
        outline-offset: 3px;
      }

      @keyframes arrive {
        from {
          opacity: 0;
          transform: translateY(8px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 520px) {
        main {
          padding-top: 30px;
        }

        .fields {
          grid-template-columns: 1fr;
        }

        .field-wide {
          grid-column: auto;
        }

        h1 {
          font-size: 29px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

  <body>
    <div class="page">
      <main>
        <p class="eyebrow">Career Portal · Thực tập sinh</p>

        <h1>Tạo tài khoản mới</h1>

        <p class="intro">
          Điền thông tin để tạo hồ sơ và nộp đơn thực tập trực tuyến.
        </p>

        <form id="register-form" novalidate>
          <div class="fields">

            <!-- HỌ TÊN -->
            <div class="field field-wide">
              <label for="name">Họ và tên *</label>

              <input
                id="name"
                name="name"
                autocomplete="name"
                placeholder="Nguyễn Văn An"
                minlength="2"
                maxlength="100"
                required
              />
            </div>

            <!-- EMAIL -->
            <div class="field">
              <label for="email">Email *</label>

              <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                placeholder="email@truong.edu.vn"
                maxlength="120"
                required
              />
            </div>

            <!-- PHONE -->
            <div class="field">
              <label for="phone">Số điện thoại *</label>

              <input
                id="phone"
                name="phone"
                type="tel"
                autocomplete="tel"
                placeholder="0912345678"
                pattern="(0|\\+84)[0-9]{9,10}"
                title="Nhập số điện thoại hợp lệ, ví dụ 0912345678"
                required
              />
            </div>

            <!-- SCHOOL -->
            <div class="field">
              <label for="school">Trường *</label>

              <input
                id="school"
                name="school"
                placeholder="Tên trường đại học/cao đẳng"
                minlength="2"
                maxlength="150"
                required
              />
            </div>

            <!-- MAJOR -->
            <div class="field">
              <label for="major">Ngành học *</label>

              <input
                id="major"
                name="major"
                placeholder="Ví dụ: Marketing"
                minlength="2"
                maxlength="100"
                required
              />
            </div>

            <!-- PASSWORD -->
            <div class="field">
              <label for="password">Mật khẩu *</label>

              <input
                id="password"
                name="password"
                type="password"
                autocomplete="new-password"
                minlength="8"
                maxlength="100"
                placeholder="Tối thiểu 8 ký tự"
                required
              />
            </div>

            <!-- CONFIRM PASSWORD -->
            <div class="field">
              <label for="confirm-password">
                Xác nhận mật khẩu *
              </label>

              <input
                id="confirm-password"
                name="confirmPassword"
                type="password"
                autocomplete="new-password"
                minlength="8"
                maxlength="100"
                placeholder="Nhập lại mật khẩu"
                required
              />
            </div>
          </div>

          <p class="helper">
            Email đã có tài khoản sẽ không được đăng ký lại.
            Tài khoản demo được lưu trên trình duyệt này.
          </p>

          <button class="submit-button" id="submit-button" type="submit">
            <span>Đăng ký tài khoản</span>
            <span class="submit-arrow" aria-hidden="true">→</span>
          </button>

          <p
            class="form-message"
            id="form-message"
            role="status"
            aria-live="polite"
          ></p>
        </form>

        <a class="login-link" href="intern-login.html">
          Đã có tài khoản? Đăng nhập
        </a>
      </main>

      <footer>
        <span>© 2026 Career Portal</span>

        <a href="mailto:support@career-portal.vn">
          Hỗ trợ đăng nhập
        </a>
      </footer>
    </div>

    <script>
      const storageKey = "careerPortal.demo.v1";

      const form = document.querySelector("#register-form");
      const message = document.querySelector("#form-message");
      const submitButton = document.querySelector("#submit-button");

      function readData() {
        try {
          return JSON.parse(
            localStorage.getItem(storageKey) || "{}",
          );
        } catch {
          return {};
        }
      }

      function normalizeEmail(value) {
        return (value || "")
          .trim()
          .toLocaleLowerCase("vi");
      }

      function toHex(bytes) {
        return [...new Uint8Array(bytes)]
          .map((byte) =>
            byte.toString(16).padStart(2, "0"),
          )
          .join("");
      }

      async function hashPassword(password, salt) {
        const bytes = new TextEncoder().encode(
          `${salt}:${password}`,
        );

        return toHex(
          await crypto.subtle.digest("SHA-256", bytes),
        );
      }

      function showMessage(text, state = "error") {
        message.textContent = text;
        message.dataset.state = state;
      }

      function clearMessage() {
        message.textContent = "";
        message.dataset.state = "";
      }

      function validateBusinessRules() {
        const name = form.elements.name.value.trim();
        const email = normalizeEmail(form.elements.email.value);
        const phone = form.elements.phone.value.trim();
        const school = form.elements.school.value.trim();
        const major = form.elements.major.value.trim();
        const password = form.elements.password.value;
        const confirmPassword =
          form.elements.confirmPassword.value;

        if (name.length < 2) {
          showMessage(
            "Họ và tên phải có ít nhất 2 ký tự.",
          );
          return false;
        }

        const phonePattern =
          /^(0|\+84)[0-9]{9,10}$/;

        if (!phonePattern.test(phone)) {
          showMessage(
            "Số điện thoại không hợp lệ. Ví dụ: 0912345678.",
          );
          return false;
        }

        if (school.length < 2) {
          showMessage(
            "Vui lòng nhập tên trường hợp lệ.",
          );
          return false;
        }

        if (major.length < 2) {
          showMessage(
            "Vui lòng nhập ngành học hợp lệ.",
          );
          return false;
        }

        if (password.length < 8) {
          showMessage(
            "Mật khẩu phải có ít nhất 8 ký tự.",
          );
          return false;
        }

        if (password !== confirmPassword) {
          showMessage(
            "Mật khẩu xác nhận chưa khớp.",
          );
          return false;
        }

        return {
          name,
          email,
          phone,
          school,
          major,
          password,
        };
      }

      form.addEventListener(
        "submit",
        async (event) => {
          event.preventDefault();

          clearMessage();

          if (!form.reportValidity()) {
            showMessage(
              "Vui lòng kiểm tra lại các trường bắt buộc.",
            );
            return;
          }

          const values = validateBusinessRules();

          if (!values) {
            return;
          }

          const data = readData();

          const accounts = data.accounts || [];

          const emailExists = accounts.some(
            (account) =>
              normalizeEmail(account.email) ===
              values.email,
          );

          if (emailExists) {
            showMessage(
              "Email này đã có tài khoản. Hãy đăng nhập hoặc dùng email khác.",
            );
            return;
          }

          if (
            !window.crypto ||
            !crypto.subtle ||
            !crypto.getRandomValues
          ) {
            showMessage(
              "Trình duyệt không hỗ trợ tạo tài khoản demo.",
            );
            return;
          }

          submitButton.disabled = true;

          try {
            const students = data.students || [];

            const existingStudent =
              students.find(
                (student) =>
                  normalizeEmail(student.email) ===
                  values.email,
              );

            const profile = {
              id:
                existingStudent?.id ||
                `SV${String(Date.now()).slice(-6)}`,

              name: values.name,
              email: values.email,
              phone: values.phone,
              school: values.school,
              major: values.major,
            };

            const passwordSalt = toHex(
              crypto.getRandomValues(
                new Uint8Array(16),
              ),
            );

            const passwordHash =
              await hashPassword(
                values.password,
                passwordSalt,
              );

            const newAccount = {
              ...profile,
              passwordSalt,
              passwordHash,
              status: "active",
              createdAt:
                new Date().toISOString(),
            };

            data.accounts = [
              ...accounts,
              newAccount,
            ];

            data.internProfile = profile;

            const student = {
              ...existingStudent,
              ...profile,
              status:
                existingStudent?.status ||
                "Chờ tiếp nhận",
              updated:
                new Intl.DateTimeFormat(
                  "vi-VN",
                ).format(new Date()),
            };

            data.students = [
              student,
              ...students.filter(
                (item) =>
                  normalizeEmail(item.email) !==
                  values.email,
              ),
            ];

            data.loginSession = {
              userId: profile.id,
              role: "intern",
              loginAt:
                new Date().toISOString(),
            };

            localStorage.setItem(
              storageKey,
              JSON.stringify(data),
            );

            showMessage(
              "Đăng ký tài khoản thành công. Đang chuyển đến hồ sơ...",
              "success",
            );

            setTimeout(() => {
              window.location.href =
                "intern-dashboard.html";
            }, 700);
          } catch (error) {
            console.error(error);

            showMessage(
              "Không thể tạo tài khoản. Vui lòng thử lại.",
            );

            submitButton.disabled = false;
          }
        },
      );
    </script>
  </body>
</html>
