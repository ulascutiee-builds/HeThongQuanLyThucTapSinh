<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#173e34" />
  <title>Kích hoạt tài khoản | Career Portal</title>
  <style>
    :root{color-scheme:light;font-family:"Segoe UI",Arial,sans-serif;--forest:#173e34;--ink:#25332d;--muted:#6e7d73;--line:#dce4db}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 18px;background:radial-gradient(circle at top left,#cde1d5,transparent 55%),#f3f5ef;color:var(--ink)}main{background:#fff;border:1px solid var(--line);border-radius:18px;width:100%;max-width:470px;padding:38px;box-shadow:0 15px 60px #24492f0d}.brand{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:700;color:var(--forest)}.brand img{width:46px;height:46px}.brand small{display:block;font-size:10px;color:var(--muted);letter-spacing:.04em;margin-top:5px}h1{font-family:Georgia,serif;font-size:31px;font-weight:500;margin:30px 0 12px}p{font-size:14px;color:var(--muted);line-height:1.7}form{display:grid;gap:20px;margin-top:25px}label{display:grid;gap:8px;font-size:13px;font-weight:600}input,button{font:inherit}input{width:100%;border:1px solid var(--line);padding:13px;border-radius:8px;color:var(--ink)}input:focus{outline:2px solid #78a88f;outline-offset:2px}.hint{font-size:12px;color:var(--muted);line-height:1.5;font-weight:400}.show{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:400}.show input{width:auto;accent-color:var(--forest)}button,.link{background:var(--forest);color:#fff;padding:13px 18px;border:0;border-radius:8px;text-align:center;text-decoration:none;font-size:14px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.message{font-size:13px;line-height:1.6;padding:13px 15px;border-radius:8px;background:#fff1ed;color:#a03b2c}.success{background:#eaf4ee;color:#285b3d}.footer{margin:24px 0 0;font-size:12px;text-align:center}.footer a{color:var(--forest)}[hidden]{display:none!important}@media(max-width:500px){main{padding:28px 24px}h1{font-size:27px}}
  </style>
  <link rel="stylesheet" href="system-font.css?v=20261009" />
  <link rel="stylesheet" href="portal.css?v=20261009-blue" />
</head>
<body class="activation-page">
  <main>
    <div class="brand"><img src="codegym-logo.svg" alt="CodeGym" /><div>CAREER PORTAL<small>HỆ THỐNG QUẢN LÝ THỰC TẬP SINH</small></div></div>
    <h1 id="title">Kích hoạt tài khoản</h1>
    <p id="description">Thiết lập mật khẩu để hoàn tất lời mời và bắt đầu sử dụng tài khoản của bạn.</p>
    <div id="message" class="message" role="alert" hidden></div>
    <form id="activation-form">
      <label>Mật khẩu mới<input id="password" name="password" type="password" minlength="8" maxlength="200" autocomplete="new-password" required /><span class="hint">Ít nhất 8 ký tự. Nên kết hợp chữ hoa, chữ thường và số để bảo vệ tài khoản.</span></label>
      <label>Xác nhận mật khẩu<input id="confirm-password" name="confirmPassword" type="password" minlength="8" maxlength="200" autocomplete="new-password" required /></label>
      <label class="show"><input id="show-password" type="checkbox" />Hiển thị mật khẩu</label>
      <button id="activate" type="submit">Kích hoạt tài khoản</button>
    </form>
    <a class="link" href="dang-nhap.html" id="login-link" style="display:block;margin-top:22px" hidden>Đăng nhập</a>
    <p class="footer"><a href="dang-nhap.html">Quay lại trang đăng nhập</a></p>
  </main>
  <script src="activation.js" defer></script>
</body>
</html>
